name: Kali Server

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Install Node
        run: |
          sudo apt update
          sudo apt install nodejs -y
      - name: Run Server
        run: |
          node server.js